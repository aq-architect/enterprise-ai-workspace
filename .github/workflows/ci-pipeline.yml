name: Enterprise Ecosystem CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  gateway-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Compile Gateway Production Code
        run: npx nx build gateway-server

  ai-core-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent-core/requirements.txt

      - name: Install Python Dependencies
        run: |
          cd agent-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Linting Check
        run: |
          pip install flake8
          cd agent-core
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  client-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Compile Production Web Assets
        run: npx nx build client
