name: Docker Build

on:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'apps/**/Dockerfile'
      - 'agent-core/Dockerfile'
      - 'package.json'
      - 'agent-core/requirements.txt'
  pull_request:
    branches: [master, main]
    paths:
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'apps/**/Dockerfile'
      - 'agent-core/Dockerfile'
      - 'package.json'
      - 'agent-core/requirements.txt'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create placeholder env files for compose config
        run: |
          cp agent-core/.env.example agent-core/.env
          cp apps/gateway-server/.env.example apps/gateway-server/.env

      - name: Validate compose file
        run: docker compose config

      - name: Build all service images
        run: docker compose build
